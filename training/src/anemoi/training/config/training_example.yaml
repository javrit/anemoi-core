defaults:
- data: zarr_uncond
- dataloader: native_grid
- diagnostics: enrichment
- datamodule: single
- hardware: example
- graph: existing_graph
- model: graphtransformer_diffusion
- training: diffusion
- _self_

config_validation: False

diagnostics:
  log:
    mlflow:
      enabled: False
    wandb:
      enabled: False
      entity: "none"
  plot:
    callbacks:
      - _target_: anemoi.training.diagnostics.callbacks.plot.GraphTrainableFeaturesPlot
        every_n_epochs: 1
  checkpoint:
    every_n_epochs:
      save_frequency: 1
      num_models_saved: -1
  check_val_every_n_epoch: 1

data:
  diagnostic: []
  forcing:
    - "z"
    - "cos_latitude"
    - "cos_longitude"
    - "sin_latitude"
    - "sin_longitude"
    - "cos_julian_day"
    - "cos_local_time"
    - "sin_julian_day"
    - "sin_local_time"
    - "insolation"
    - "lsm"
  normalizer:
    std: null
    max: null
    none: null
  frequency: 1h
  timestep: 3h

dataloader:
  dataset:
    - dataset: /path/to/your/dataset.zarr              # <-- update
  grid_indices:
    _target_: anemoi.training.data.grid_indices.FullGrid
  training:
    start: "2020-01-01"
    end: "2023-03-31"
    select: ['10u', '10v', '2d', '2t', 'msl', 'sp', 'skt', 'z', 'q_50', 'q_100', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_700', 'q_850', 'q_925', 'q_1000', 't_50', 't_100', 't_150', 't_200', 't_250', 't_300', 't_400', 't_500', 't_700', 't_850', 't_925', 't_1000', 'u_50', 'u_100', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_700', 'u_850', 'u_925', 'u_1000', 'v_50', 'v_100', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_500', 'v_700', 'v_850', 'v_925', 'v_1000', 'z_50', 'z_100', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_500', 'z_700', 'z_850', 'z_925', 'z_1000', lsm, insolation, cos_julian_day, cos_latitude, cos_local_time, cos_longitude, sin_julian_day, sin_latitude, sin_local_time, sin_longitude]
  validation:
    start: "2023-04-01"
    end: "2023-04-02"
    select: ['10u', '10v', '2d', '2t', 'msl', 'sp', 'skt', 'z', 'q_50', 'q_100', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_700', 'q_850', 'q_925', 'q_1000', 't_50', 't_100', 't_150', 't_200', 't_250', 't_300', 't_400', 't_500', 't_700', 't_850', 't_925', 't_1000', 'u_50', 'u_100', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_700', 'u_850', 'u_925', 'u_1000', 'v_50', 'v_100', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_500', 'v_700', 'v_850', 'v_925', 'v_1000', 'z_50', 'z_100', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_500', 'z_700', 'z_850', 'z_925', 'z_1000', lsm, insolation, cos_julian_day, cos_latitude, cos_local_time, cos_longitude, sin_julian_day, sin_latitude, sin_local_time, sin_longitude]
  test:
    start: "2024-04-02"
    end: "2024-04-03"
    select: ['10u', '10v', '2d', '2t', 'msl', 'sp', 'skt', 'z', 'q_50', 'q_100', 'q_150', 'q_200', 'q_250', 'q_300', 'q_400', 'q_500', 'q_700', 'q_850', 'q_925', 'q_1000', 't_50', 't_100', 't_150', 't_200', 't_250', 't_300', 't_400', 't_500', 't_700', 't_850', 't_925', 't_1000', 'u_50', 'u_100', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_500', 'u_700', 'u_850', 'u_925', 'u_1000', 'v_50', 'v_100', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_500', 'v_700', 'v_850', 'v_925', 'v_1000', 'z_50', 'z_100', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_500', 'z_700', 'z_850', 'z_925', 'z_1000', lsm, insolation, cos_julian_day, cos_latitude, cos_local_time, cos_longitude, sin_julian_day, sin_latitude, sin_local_time, sin_longitude]
  batch_size:
    training: 1
    validation: 1
    test: 1

model:
  num_channels: 1024
  model:
    _target_: anemoi.models.models.AnemoiDiffusionModelEncProcDecUnconditional
    diffusion:
      sigma_max: 1000
  processor:
    num_layers: 16
  condition: "mean"  # options: "zero", "mean", "mean_3vars", "orography", "orography_3vars"

hardware:
  paths:
    data: /path/to/dataset/folder                      # <-- update
    output: /path/to/output-dir                        # <-- update
  files:
    dataset: your-dataset.zarr                         # <-- update
    graph: /path/to/graph.pt                           # <-- update
  num_gpus_per_node: 4
  num_gpus_per_model: 2
  num_nodes: 8

training:
  max_steps: 500000
  model_task: anemoi.training.train.tasks.GraphUnconditionalDiffusionForecaster
  training_approach: probabilistic_high_noise
  multistep_input: 1

